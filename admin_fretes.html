<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Fretes - Conecta Frete</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f4f4;
}

h1{
  text-align:center;
  padding:20px;
  background:#2a5298;
  color:white;
  margin:0;
}

.container{
  padding:15px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:10px;
  overflow:hidden;
}

th, td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
  font-size:14px;
}

th{
  background:#2a5298;
  color:white;
}

tr:hover{
  background:#f1f1f1;
}

/* 🔥 BOTÃO CENTRALIZADO */
.botao-voltar{
  display:flex;
  justify-content:center;
  margin:20px 0;
}

.botao-voltar button{
  width:70%;
  max-width:300px;
  padding:12px;
  background:#2a5298;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

.botao-voltar button:hover{
  background:#1e3c72;
}
</style>
</head>

<body>

<h1>Painel de Fretes 🚛</h1>

<div class="container">
  <table>
    <thead>
      <tr>
        <th>Origem</th>
        <th>Destino</th>
        <th>Carga</th>
        <th>Ton</th>
        <th>Valor/Ton</th>
        <th>Total</th>
        <th>Data</th>
      </tr>
    </thead>
    <tbody id="tabelaFretes">
      <tr><td colspan="7">Carregando...</td></tr>
    </tbody>
  </table>
</div>

<!-- 🔥 BOTÃO VOLTAR CENTRALIZADO -->
<div class="botao-voltar">
  <button onclick="voltar()">Voltar</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "conecta-frete-53e03.firebaseapp.com",
  projectId: "conecta-frete-53e03",
  storageBucket: "conecta-frete-53e03.appspot.com",
  messagingSenderId: "558425558991",
  appId: "1:558425558991:web:89069fccbd3b3cf3884cba"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tabela = document.getElementById("tabelaFretes");

// 🔹 CARREGAR FRETES
async function carregarFretes(){

  tabela.innerHTML = `<tr><td colspan="7">Carregando...</td></tr>`;

  const querySnapshot = await getDocs(collection(db, "fretes"));

  if(querySnapshot.empty){
    tabela.innerHTML = `<tr><td colspan="7">Nenhum frete cadastrado</td></tr>`;
    return;
  }

  tabela.innerHTML = "";

  querySnapshot.forEach((docSnap)=>{

    let frete = docSnap.data();

    tabela.innerHTML += `
      <tr>
        <td>${frete.origem || ""}</td>
        <td>${frete.destino || ""}</td>
        <td>${frete.tipoCarga || ""}</td>
        <td>${frete.quantidade || ""}</td>
        <td>${formatarDinheiro(frete.valorTon)}</td>
        <td>${formatarDinheiro(frete.valorTotal)}</td>
        <td>${frete.data || ""}</td>
      </tr>
    `;

  });

}

// 💰 FORMATAR DINHEIRO
function formatarDinheiro(valor){
  return Number(valor || 0).toLocaleString("pt-BR",{
    style:"currency",
    currency:"BRL"
  });
}

// 🚀 INICIAR
carregarFretes();

</script>

<script>
function voltar(){
  window.location.href = "admin_painel.html";
}
</script>

</body>
</html>
