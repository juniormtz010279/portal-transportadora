<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
width:300px;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:10px;
background:#2a5298;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
<h2>Área Administrativa 🔒</h2>

<button onclick="window.location.href='motoristas_admin.html'">
Ver Motoristas
</button>

<button onclick="window.location.href='empresas_admin.html'">
Ver Empresas
</button>

<button onclick="window.location.href='admin_fretes.html'">
Ver Fretes
</button>

<button onclick="sair()">Sair</button>
</div>

<script>

let usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

// 🔐 BLOQUEIO TOTAL
if(!usuario || usuario.admin !== true){
    alert("Acesso restrito!");
    window.location.href = "index.html";
}

function sair(){
    window.location.href = "painel_empresa.html";
}

</script>

</body>
</html>
