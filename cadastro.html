<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Conecta Frete</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    width: 90%;
    max-width: 400px;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
}

h1 {
    color: #2a5298;
    margin-bottom: 5px;
}

.subtitulo {
    font-size: 14px;
    color: gray;
    margin-bottom: 25px;
}

button {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    background: #2a5298;
    color: white;
}

button:hover {
    background: #1e3c72;
}

.voltar {
    margin-top: 15px;
    font-size: 14px;
}

.voltar a {
    color: #2a5298;
    text-decoration: none;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="container">

    <h1>Conecta Frete</h1>
    <div class="subtitulo">
        Conectando empresas e motoristas 🚛
    </div>

    <h2>Escolha seu perfil</h2>

    <button onclick="motorista()">🚛 Sou Motorista</button>
    <button onclick="empresa()">🏢 Sou Empresa</button>

    <div class="voltar">
        <a href="index.html">Voltar para Login</a>
    </div>

</div>

<script>
function motorista(){
    window.location.href = "cadastro_motorista.html";
}

function empresa(){
    window.location.href = "cadastro_empresa.html";
}
</script>

</body>
</html>
