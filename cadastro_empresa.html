<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro Empresa - Conecta Frete</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 30px 0;
}

.container {
    background: white;
    width: 90%;
    max-width: 340px;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
}

h1 {
    color: #2a5298;
    margin-bottom: 5px;
}

.subtitulo {
    font-size: 14px;
    color: gray;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 13px;
}

button {
    width: 100%;
    padding: 10px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1e3c72;
}

.voltar {
    margin-top: 15px;
    font-size: 14px;
}

.voltar a {
    color: #2a5298;
    text-decoration: none;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="container">

    <h1>Conecta Frete</h1>
    <div class="subtitulo">
        Cadastro de Empresa 🏢
    </div>

    <input type="text" id="nomeEmpresa" placeholder="Nome da Empresa">
    <input type="text" id="cnpj" placeholder="CNPJ" maxlength="18" oninput="formatarCNPJ(this)">
    <input type="text" id="telefone" placeholder="Telefone" maxlength="15" oninput="formatarTelefone(this)">
    <input type="text" id="whatsapp" placeholder="WhatsApp" maxlength="15" oninput="formatarTelefone(this)">
    <input type="text" id="endereco" placeholder="Endereço">
    <input type="text" id="login" placeholder="Criar Login">
    <input type="password" id="senha" placeholder="Criar Senha">

    <button onclick="cadastrar()">Cadastrar</button>

    <div class="voltar">
        <a href="cadastro.html">Voltar</a>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔥 CONFIG FIREBASE (igual dos outros arquivos)
const firebaseConfig = {
  apiKey: "AIzaSyC5iPsX34H7evZiDwTm9CUnl0CRA6iLnpQ",
  authDomain: "conecta-frete-53e03.firebaseapp.com",
  projectId: "conecta-frete-53e03",
  storageBucket: "conecta-frete-53e03.appspot.com",
  messagingSenderId: "558425558991",
  appId: "1:558425558991:web:89069fccbd3b3cf3884cba"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 CRIPTOGRAFAR SENHA
async function criptografarSenha(senha){
    const encoder = new TextEncoder();
    const data = encoder.encode(senha);

    const hash = await crypto.subtle.digest("SHA-256", data);

    return Array.from(new Uint8Array(hash))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}

// FORMATADORES
window.formatarTelefone = function(campo){
    let valor = campo.value.replace(/\D/g, "");
    if(valor.length > 11) valor = valor.slice(0,11);

    if(valor.length > 0) valor = "(" + valor;
    if(valor.length > 2) valor = valor.slice(0,3) + ") " + valor.slice(3);
    if(valor.length > 10) valor = valor.slice(0,10) + "-" + valor.slice(10);

    campo.value = valor;
}

window.formatarCNPJ = function(campo){
    let valor = campo.value.replace(/\D/g, "");
    if(valor.length > 14) valor = valor.slice(0,14);

    if(valor.length > 2) valor = valor.slice(0,2) + "." + valor.slice(2);
    if(valor.length > 6) valor = valor.slice(0,6) + "." + valor.slice(6);
    if(valor.length > 10) valor = valor.slice(0,10) + "/" + valor.slice(10);
    if(valor.length > 15) valor = valor.slice(0,15) + "-" + valor.slice(15);

    campo.value = valor;
}

// 🚀 CADASTRAR EMPRESA
window.cadastrar = async function(){

    let nomeEmpresa = document.getElementById("nomeEmpresa").value;
    let login = document.getElementById("login").value;
    let senha = document.getElementById("senha").value;

    if(!nomeEmpresa || !login || !senha){
        alert("Preencha os campos obrigatórios!");
        return;
    }

    // 🔎 VERIFICAR LOGIN DUPLICADO
    const q = query(collection(db,"empresas"), where("login","==",login));
    const res = await getDocs(q);

    if(!res.empty){
        alert("Este login já está em uso!");
        return;
    }

    let senhaCriptografada = await criptografarSenha(senha);

    let empresa = {
        tipo: "empresa",
        nomeEmpresa: nomeEmpresa,
        cnpj: document.getElementById("cnpj").value,
        telefone: document.getElementById("telefone").value,
        whatsapp: document.getElementById("whatsapp").value,
        endereco: document.getElementById("endereco").value,
        login: login,
        senha: senhaCriptografada
    };

    await addDoc(collection(db,"empresas"), empresa);

    alert("Empresa cadastrada com sucesso! 🏢");

    window.location.href = "index.html";
}

</script>

</body>
</html>
