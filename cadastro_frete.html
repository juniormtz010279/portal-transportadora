<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastrar Frete - Conecta Frete</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:90%;
max-width:260px;
padding:35px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h1{
text-align:center;
color:#2a5298;
margin-bottom:20px;
}

input,textarea,select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#2a5298;
color:white;
font-size:15px;
cursor:pointer;
margin-top:5px;
}

button:hover{
background:#1e3c72;
}

</style>
</head>

<body>

<div class="container">

<h1>Novo Frete 🚛</h1>

<input type="text" id="origem" placeholder="Cidade de Carregamento">
<input type="text" id="destino" placeholder="Cidade de Entrega">
<input type="text" id="empresaCarga" placeholder="Empresa que vai carregar">

<select id="caminhao">
<option value="">Selecione</option>
<option value="Truck">Truck</option>
<option value="Bitruck">Bitruck</option>
<option value="Carreta">Carreta</option>
<option value="Bitrem">Bitrem</option>
<option value="Rodotrem">Rodotrem</option>
</select>

<input type="text" id="tipoCarga" placeholder="Tipo de Carga">

<input type="number" id="valorTon" placeholder="Valor por Tonelada" oninput="calcularTotal()">
<input type="number" id="quantidade" placeholder="Quantidade (toneladas)" oninput="calcularTotal()">

<input type="text" id="valorTotal" placeholder="Valor Total do Frete" readonly>

<input type="date" id="data">

<textarea id="observacao" placeholder="Observações"></textarea>

<button onclick="salvarFrete()">
Salvar Frete
</button>

<button onclick="voltar()">
Voltar
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyC5iPsX34H7evZiDwTm9CUnl0CRA6iLnpQ",
authDomain: "conecta-frete-53e03.firebaseapp.com",
projectId: "conecta-frete-53e03",
storageBucket: "conecta-frete-53e03.appspot.com",
messagingSenderId: "558425558991",
appId: "1:558425558991:web:89069fccbd3b3cf3884cba"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔢 CALCULAR TOTAL
window.calcularTotal = function(){

let valorTon = parseFloat(document.getElementById("valorTon").value) || 0;
let quantidade = parseFloat(document.getElementById("quantidade").value) || 0;

let total = valorTon * quantidade;

document.getElementById("valorTotal").value = total.toFixed(2);

}

// 💾 SALVAR FRETE
window.salvarFrete = async function(){

let origem = document.getElementById("origem").value.trim();
let destino = document.getElementById("destino").value.trim();
let empresaCarga = document.getElementById("empresaCarga").value.trim();
let tipoCaminhao = document.getElementById("caminhao").value;
let tipoCarga = document.getElementById("tipoCarga").value.trim();
let valorTon = parseFloat(document.getElementById("valorTon").value) || 0;
let quantidade = parseFloat(document.getElementById("quantidade").value) || 0;
let valorTotal = parseFloat(document.getElementById("valorTotal").value) || 0;
let data = document.getElementById("data").value;
let observacao = document.getElementById("observacao").value.trim();

// 🔒 VALIDAÇÃO
if(!origem || !destino || !valorTon || !quantidade){
    alert("Preencha os campos obrigatórios!");
    return;
}

if(valorTotal <= 0){
    alert("Valor total inválido!");
    return;
}

// 🔥 USUÁRIO LOGADO (CORRIGIDO)
let empresa = JSON.parse(localStorage.getItem("usuarioLogado"));

if(!empresa){
    alert("Erro: usuário não encontrado");
    return;
}

let nomeEmpresa = empresa.nome || empresa.nomeEmpresa;

// 💾 SALVAR NO FIREBASE
try{

await addDoc(collection(db, "fretes"), {

origem,
destino,
empresaCarga,
tipoCaminhao,
tipoCarga,
valorTon,
quantidade,
valorTotal,
data,
observacao,
nomeEmpresa,
telefoneEmpresa: empresa.telefone

});

alert("Frete cadastrado com sucesso! 🚀");

// 🔔 ENVIAR NOTIFICAÇÃO AUTOMÁTICA
fetch("http://localhost:3000/enviar-notificacao");

window.location.href="painel_empresa.html";

}catch(e){

console.error(e);
alert("Erro ao salvar frete");

}

}

// 🔙 VOLTAR
window.voltar = function(){
window.location.href="painel_empresa.html";
}

</script>

</body>
</html>
