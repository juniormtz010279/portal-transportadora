<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novo Frete - Conecta Frete</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 30px 0;
}

.container {
    background: white;
    width: 90%;
    max-width: 380px;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h1 {
    text-align: center;
    color: #2a5298;
    margin-bottom: 5px;
}

.subtitulo {
    text-align: center;
    font-size: 14px;
    color: gray;
    margin-bottom: 20px;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 13px;
}

textarea {
    resize: none;
}

button {
    width: 100%;
    padding: 10px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1e3c72;
}
</style>
</head>
<body>

<div class="container">

    <h1>Conecta Frete</h1>
    <div class="subtitulo">Cadastrar Novo Frete 🚛</div>

    <input type="text" id="origem" placeholder="Cidade de Carregamento">
    <input type="text" id="destino" placeholder="Cidade de Entrega">
    <input type="text" id="tipoCarga" placeholder="Tipo de Carga">
    <input type="number" id="valorTon" placeholder="Valor por Tonelada" oninput="calcularTotal()">
    <input type="number" id="quantidade" placeholder="Quantidade (toneladas)" oninput="calcularTotal()">
    <input type="text" id="valorTotal" placeholder="Valor Total do Frete" readonly>
    <input type="date" id="data">
    <textarea id="observacao" placeholder="Observações"></textarea>

    <button onclick="salvarFrete()">Salvar Frete</button>
    <button onclick="voltar()">Voltar</button>

</div>

<script>

let login = localStorage.getItem("usuarioLogado");

if(!login){
    window.location.href = "login.html";
}

let usuario = JSON.parse(localStorage.getItem(login));

if(usuario.tipo !== "empresa"){
    window.location.href = "login.html";
}

function calcularTotal(){
    let valorTon = parseFloat(document.getElementById("valorTon").value) || 0;
    let quantidade = parseFloat(document.getElementById("quantidade").value) || 0;

    let total = valorTon * quantidade;

    document.getElementById("valorTotal").value = 
        total.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function salvarFrete(){

    let frete = {
        empresa: usuario.nomeEmpresa,
        origem: document.getElementById("origem").value,
        destino: document.getElementById("destino").value,
        tipoCarga: document.getElementById("tipoCarga").value,
        valorTon: document.getElementById("valorTon").value,
        quantidade: document.getElementById("quantidade").value,
        valorTotal: document.getElementById("valorTotal").value,
        data: document.getElementById("data").value,
        observacao: document.getElementById("observacao").value
    };

    let listaFretes = JSON.parse(localStorage.getItem("fretes")) || [];

    listaFretes.push(frete);

    localStorage.setItem("fretes", JSON.stringify(listaFretes));

    alert("Frete cadastrado com sucesso!");

    window.location.href = "painel_empresa.html";
}

function voltar(){
    window.location.href = "painel_empresa.html";
}

</script>

</body>
</html>
