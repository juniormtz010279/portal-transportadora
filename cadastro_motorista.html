<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro Motorista - Conecta Frete</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: flex-start; /* ALTERADO */
    min-height: 100vh;
    padding: 30px 0; /* AUMENTADO */
}

.container {
    background: white;
    width: 90%;
    max-width: 380px; /* AUMENTADO */
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
    margin-bottom: 30px; /* GARANTE ESPAÇO FINAL */
}

h1 {
    color: #2a5298;
    margin-bottom: 5px;
}

.subtitulo {
    font-size: 14px;
    color: gray;
    margin-bottom: 20px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 13px;
}

button {
    width: 100%;
    padding: 10px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1e3c72;
}

.voltar {
    margin-top: 15px;
    font-size: 14px;
}

.voltar a {
    color: #2a5298;
    text-decoration: none;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="container">

    <h1>Conecta Frete</h1>
    <div class="subtitulo">
        Cadastro de Motorista 🚛
    </div>

    <input type="text" id="nome" placeholder="Nome do Motorista">
    <input type="text" id="telefone" placeholder="Telefone / WhatsApp" maxlength="15" oninput="formatarTelefone(this)">
    <input type="text" id="cidade" placeholder="Cidade / Estado">
    <input type="text" id="regiao" placeholder="Região que atende (Ex: MG / ES)">

    <select id="caminhao">
        <option value="">Tipo de Caminhão</option>
        <option>Truck</option>
        <option>Carreta</option>
        <option>LS</option>
        <option>Bitrem</option>
        <option>Bitruck</option>
    </select>

    <input type="number" id="capacidade" placeholder="Capacidade (toneladas)">
    <input type="text" id="login" placeholder="Criar Login">
    <input type="password" id="senha" placeholder="Criar Senha">

    <button onclick="cadastrar()">Cadastrar</button>

    <div class="voltar">
        <a href="cadastro.html">Voltar</a>
    </div>

</div>

<script>

function formatarTelefone(campo){

    let valor = campo.value.replace(/\D/g, ""); // remove tudo que não é número

    if(valor.length > 11){
        valor = valor.slice(0,11);
    }

    if(valor.length > 0){
        valor = "(" + valor;
    }

    if(valor.length > 2){
        valor = valor.slice(0,3) + ") " + valor.slice(3);
    }

    if(valor.length > 10){
        valor = valor.slice(0,10) + "-" + valor.slice(10);
    }

    campo.value = valor;
}

function cadastrar(){

    let motorista = {
        tipo: "motorista",
        nome: document.getElementById("nome").value,
        telefone: document.getElementById("telefone").value,
        cidade: document.getElementById("cidade").value,
        regiao: document.getElementById("regiao").value,
        caminhao: document.getElementById("caminhao").value,
        capacidade: document.getElementById("capacidade").value,
        login: document.getElementById("login").value,
        senha: document.getElementById("senha").value
    };

    if(motorista.nome === "" || motorista.login === "" || motorista.senha === ""){
        alert("Preencha os campos obrigatórios!");
        return;
    }

    // Verifica se login já existe
       if(localStorage.getItem(motorista.login)){
       alert("Este login já está em uso. Escolha outro.");
       return;
    }

    localStorage.setItem(motorista.login, JSON.stringify(motorista));

    alert("Cadastro realizado com sucesso!");

    window.location.href = "login.html";
}
</script>

</body>
</html>
