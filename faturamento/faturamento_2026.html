<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Faturamento</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    background: #0f0f0f;
    color: #ffffff;
    font-family: Arial, sans-serif;
    margin: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.container {
    display: flex;
    gap: 20px;
}

.box {
    background: #1a1a1a;
    border-radius: 8px;
    padding: 10px;
    width: 33%;
    max-height: 260px;
    overflow-y: auto;
}

.box h3 {
    margin: 0 0 6px 0;
    font-size: 15px;
}

/* 🔽 AQUI ESTÁ O AJUSTE PRINCIPAL */
.box ul {
    padding-left: 16px;
    margin: 0;
}

.box li {
    font-size: 12px;        /* menor */
    line-height: 1.3;       /* mais compacto */
    margin-bottom: 2px;
}

.total {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin: 20px 0;
}

select {
    background: #1a1a1a;
    color: #fff;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #444;
    margin-bottom: 15px;
}

canvas {
    max-height: 520px;
}
</style>
</head>

<body>

<h1>JANEIRO DE 2026</h1>

<div class="container">
    <div class="box">
        <h3>Faturamento por Placa</h3>
        <div id="placaResumo"></div>
    </div>

    <div class="box">
        <h3>Faturamento por Motorista</h3>
        <div id="motoristaResumo"></div>
    </div>

    <div class="box">
        <h3>Faturamento por Tomador</h3>
        <div id="tomadorResumo"></div>
    </div>
</div>

<div class="total">TOTAL GERAL: R$ 804.166,55</div>

<div style="text-align:center">
    <label>Visualizar gráfico por:</label><br>
    <select id="tipo">
        <option value="placa">Placa</option>
        <option value="motorista">Motorista</option>
        <option value="tomador">Tomador</option>
    </select>
</div>

<canvas id="grafico"></canvas>

<script>
// =====================
// FUNÇÃO DE ORDENAÇÃO
// =====================
function ordenar(labels, valores) {
    const combinado = labels.map((l, i) => ({ label: l, valor: valores[i] }));
    combinado.sort((a, b) => b.valor - a.valor);
    return {
        labels: combinado.map(i => i.label),
        valores: combinado.map(i => i.valor)
    };
}

// =====================
// DADOS
// =====================
const dados = {
    placa: ordenar(
        ["QOU8C03","QOV8D15","QPT0J86","RFY6A32","RTF4A07","RTF4A09","RTF4A11","RUC2A69","RUC2A74","RUD1E29","SYK4H02","SYL8F21","TCW4H79","TCW4H82","TCW8B75","TCZ0B74","TDB9B52","TDD0F32","TERCEIROS"],
        [54306,18810,14816,52300.8,40547.6,42396,33121.75,64817,60062,65382,37335.5,32997.65,35649.35,35487,35616.4,42020,47362,36758.5,54381]
    ),
    motorista: ordenar(
        ["CLAUDINEI","DENIS","DEYVERSON","DOUGLAS BRUNO","EDILSON","FREDERICO","GABRIEL","JOSE APARECIDO","KESLEN","MOISES","PEDRO","RENATO","ROGERSON","TERCEIROS","TOM","TUNICO","WANDER","WELLINGTON CARLOS","WILDER"],
        [60062,5130,64817,65382,32997.65,37335.5,48680,19468.8,36758.5,63744,29346,35487,47362,54381,52188,33121.75,35649.35,45379.6,36876.4]
    ),
    tomador: ordenar(
        [
            "ADUBOS REAL S.A.",
            "MACRO E MICRO COMERCIO DE ADUBOS LTDA",
            "GERALDO SALES LANA",
            "MENDES E SOARES ACABAMENTOS LTDA",
            "FASSA DO BRASIL INDUSTRIA E COMERCIO LTDA",
            "V & A MATERIAS DE CONSTRUCAO LTDA",
            "REDE OLT HOTEIS LTDA ME",
            "M FARIA CONSTRUCOES LTDA ME",
            "SMART HOUSE SAO JUDAS LTDA"
        ],
        [763185.4,28310.15,5700,3560.4,1445,1101.6,360,360,144]
    )
};

// =====================
// RESUMOS
// =====================
function gerarResumo(tipo, divId) {
    let html = "<ul>";
    dados[tipo].labels.forEach((l, i) => {
        html += `<li>${l}: R$ ${dados[tipo].valores[i].toLocaleString("pt-BR")}</li>`;
    });
    html += "</ul>";
    document.getElementById(divId).innerHTML = html;
}

gerarResumo("placa","placaResumo");
gerarResumo("motorista","motoristaResumo");
gerarResumo("tomador","tomadorResumo");

// =====================
// GRÁFICO (INALTERADO)
// =====================
const ctx = document.getElementById("grafico");

let chart = new Chart(ctx, {
    type: "bar",
    data: {
        labels: dados.placa.labels,
        datasets: [{
            data: dados.placa.valores,
            backgroundColor: "#4fc3f7",
            barThickness: 38
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: { display: false },
            tooltip: {
                backgroundColor: "#000",
                titleFont: { size: 16 },
                bodyFont: { size: 18, weight: "bold" },
                padding: 14,
                callbacks: {
                    label: ctx => " R$ " + ctx.raw.toLocaleString("pt-BR", {
                        minimumFractionDigits: 2
                    })
                }
            }
        },
        scales: {
            x: {
                ticks: { color: "#fff", font: { size: 12 } }
            },
            y: {
                ticks: {
                    color: "#fff",
                    font: { size: 14 },
                    callback: v => "R$ " + v.toLocaleString("pt-BR")
                }
            }
        }
    }
});

document.getElementById("tipo").addEventListener("change", e => {
    const tipo = e.target.value;
    chart.data.labels = dados[tipo].labels;
    chart.data.datasets[0].data = dados[tipo].valores;
    chart.update();
});
</script>

</body>
</html>
