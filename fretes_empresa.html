<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fretes Cadastrados - Conecta Frete</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:95%;
max-width:380px;
border-radius:20px;
padding:35px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h1{
text-align:center;
color:#2a5298;
}

.frete{
border:1px solid #ddd;
border-radius:10px;
padding:10px;
margin-top:10px;
font-size:14px;
}

button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:10px;
background:#2a5298;
color:white;
cursor:pointer;
}

button:hover{
background:#1e3c72;
}

</style>
</head>

<body>

<div class="container">

<h1>Fretes Cadastrados 🚛</h1>

<div id="listaFretes"></div>

<button onclick="voltar()">Voltar</button>

</div>

<script>

let fretes = JSON.parse(localStorage.getItem("fretes")) || [];

let div = document.getElementById("listaFretes");

if(fretes.length == 0){

div.innerHTML = "Nenhum frete cadastrado.";

}else{

fretes.slice().reverse().forEach((frete) => {

let indexReal = fretes.indexOf(frete);

div.innerHTML += `
<div class="frete">

<b>${frete.origem} → ${frete.destino}</b><br>

Carga: ${frete.tipoCarga}<br>
Quantidade: ${frete.quantidade} ton<br>
Valor por ton: ${formatarDinheiro(frete.valorTon)}<br>
Valor total: ${formatarDinheiro(frete.valorTotal)}<br>
Data: ${formatarData(frete.data)}<br>

<button onclick="editarFrete(${indexReal})">
Editar Frete
</button>

<button onclick="excluirFrete(${indexReal})">
Excluir Frete
</button>

</div>
`;

});

}

function voltar(){

window.location.href = "painel_empresa.html";

}

function excluirFrete(i){

let fretes = JSON.parse(localStorage.getItem("fretes")) || [];

if(confirm("Deseja excluir este frete?")){

fretes.splice(i,1);

localStorage.setItem("fretes", JSON.stringify(fretes));

location.reload();

}

}

function editarFrete(i){

localStorage.setItem("freteEditando", i);

window.location.href = "editar_frete.html";

}

function formatarData(data){

let partes = data.split("-");

return partes[2] + "-" + partes[1] + "-" + partes[0];

}

function formatarDinheiro(valor){

return Number(valor).toLocaleString("pt-BR",{
style:"currency",
currency:"BRL"
});

}

</script>

</body>
</html>
