<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fretes Cadastrados - Conecta Frete</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(to bottom,#1e3c72,#2a5298);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.container{
  background:white;
  width:95%;
  max-width:380px;
  border-radius:20px;
  padding:35px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
h1{
  text-align:center;
  color:#2a5298;
}
.frete{
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
  font-size:14px;
}
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#2a5298;
  color:white;
  cursor:pointer;
}
button:hover{
  background:#1e3c72;
}
</style>
</head>
<body>
<div class="container">
  <h1>Fretes Cadastrados 🚛</h1>
  <div id="listaFretes">Carregando fretes...</div>
  <button onclick="voltar()">Voltar</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Config do Firebase
const firebaseConfig = {
  apiKey: "AIzaSyC5iPsX34H7evZiDwTm9CUnl0CRA6iLnpQ",
  authDomain: "conecta-frete-53e03.firebaseapp.com",
  projectId: "conecta-frete-53e03",
  storageBucket: "conecta-frete-53e03.appspot.com",
  messagingSenderId: "558425558991",
  appId: "1:558425558991:web:89069fccbd3b3cf3884cba"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const div = document.getElementById("listaFretes");

// Função para carregar fretes do Firestore
async function carregarFretes(){
  div.innerHTML = "Carregando fretes...";
  const querySnapshot = await getDocs(collection(db, "fretes"));

  if(querySnapshot.empty){
    div.innerHTML = "Nenhum frete cadastrado.";
    return;
  }

  div.innerHTML = ""; // limpa antes de adicionar
  querySnapshot.forEach((docSnap)=>{
    let frete = docSnap.data();
    let id = docSnap.id;

    div.innerHTML += `
      <div class="frete">
        <b>${frete.origem} → ${frete.destino}</b><br>
        Carga: ${frete.tipoCarga}<br>
        Quantidade: ${frete.quantidade} ton<br>
        Valor por ton: ${formatarDinheiro(frete.valorTon)}<br>
        Valor total: ${formatarDinheiro(frete.valorTotal)}<br>
        Data: ${formatarData(frete.data)}<br>
        <button onclick="editarFrete('${id}')">Editar Frete</button>
        <button onclick="excluirFrete('${id}')">Excluir Frete</button>
      </div>
    `;
  });
}

// Excluir frete
window.excluirFrete = async function(id){
  if(confirm("Deseja excluir este frete?")){
    await deleteDoc(doc(db,"fretes",id));
    carregarFretes();
  }
}

// Editar frete
window.editarFrete = function(id){
  localStorage.setItem("freteEditando", id);
  window.location.href = "editar_frete.html";
}

// Voltar para painel
window.voltar = function(){
  window.location.href = "painel_empresa.html";
}

// Formatar data
function formatarData(data){
  let partes = data.split("-");
  return partes[2] + "-" + partes[1] + "-" + partes[0];
}

// Formatar dinheiro
function formatarDinheiro(valor){
  return Number(valor).toLocaleString("pt-BR",{
    style:"currency",
    currency:"BRL"
  });
}

// Carrega os fretes ao abrir a página
carregarFretes();
</script>
</body>
</html>
