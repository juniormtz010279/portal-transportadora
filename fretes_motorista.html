<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fretes Disponíveis - Conecta Frete</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:90%;
max-width:420px;
border-radius:20px;
padding:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h1{
text-align:center;
color:#2a5298;
margin-bottom:20px;
}

.frete{
border:1px solid #ddd;
border-radius:12px;
padding:12px;
margin-bottom:12px;
font-size:14px;
background:#f7f7f7;
}

.rota{
font-weight:bold;
color:#2a5298;
margin-bottom:5px;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#2a5298;
color:white;
font-size:14px;
cursor:pointer;
margin-top:8px;
}

button:hover{
background:#1e3c72;
}

</style>
</head>

<body>

<div class="container">

<h1>Fretes Disponíveis 🚛</h1>

<p id="empresaFrete" style="text-align:center;font-weight:bold;color:#2a5298;margin-top:-10px;margin-bottom:15px;"></p>

<div id="listaFretes"></div>
<button onclick="voltar()">
Voltar
</button>

</div>

<script>

let login = localStorage.getItem("usuarioLogado");

if(!login){
window.location.href="index.html";
}

let fretes = JSON.parse(localStorage.getItem("fretes")) || [];

let lista = document.getElementById("listaFretes");

if(fretes.length === 0){

lista.innerHTML="<p>Nenhum frete disponível</p>";

}

fretes.slice().reverse().forEach((frete,index)=>{

lista.innerHTML += `

<div class="frete">

<div class="rota">
${frete.origem} → ${frete.destino}
</div>

<b>Empresa:</b> ${frete.nomeEmpresa || "-"}<br>

<b>Empresa de carregamento:</b> ${frete.empresaCarga || "-"}<br>

🚚 Caminhão: ${frete.tipoCaminhao || "-"}<br>

Carga: ${frete.tipoCarga}<br>
Quantidade: ${frete.quantidade} toneladas<br>
Valor por ton: ${formatarDinheiro(frete.valorTon)}<br>
Valor total: ${formatarDinheiro(frete.valorTotal)}<br>
Data: ${formatarData(frete.data)}<br>
Obs: ${frete.observacao || "-"}

<button onclick="interesse(${index})">
Tenho Interesse
</button>

</div>

`;

});

function interesse(i){

let fretes = JSON.parse(localStorage.getItem("fretes")) || [];

let frete = fretes[i];

let telefone = frete.telefoneEmpresa;

telefone = telefone.replace(/\D/g,'');

let mensagem = `Olá, tenho interesse neste frete:

🚛 ${frete.origem} → ${frete.destino}
Empresa: ${frete.nomeEmpresa}
Empresa de carregamento: ${frete.empresaCarga}
Caminhão: ${frete.tipoCaminhao}
Carga: ${frete.tipoCarga}
Quantidade: ${frete.quantidade} toneladas
Valor total: ${frete.valorTotal}
Data: ${frete.data}
`;

let url = "https://wa.me/55"+telefone+"?text="+encodeURIComponent(mensagem);

window.open(url,"_blank");

}

function voltar(){

window.location.href="painel_motorista.html";

}

function formatarData(data){

let partes = data.split("-");

return partes[2] + "-" + partes[1] + "-" + partes[0];

}

function formatarDinheiro(valor){

return Number(valor).toLocaleString("pt-BR",{
style:"currency",
currency:"BRL"
});

}

</script>

</body>
</html>
