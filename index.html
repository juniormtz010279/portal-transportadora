<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>RodaMais - Economize em cada viagem</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🚗 RodaMais</h1>
  <p class="slogan">Economize em cada viagem</p>
</header>

<main class="container">

  <h2>⛽ Simulador de Combustível</h2>

  <label>💰 Valor para abastecer (R$)</label>
  <input type="number" id="valor" placeholder="Ex: 50">

  <label>⛽ Preço da Gasolina (R$/L)</label>
  <input type="number" id="precoGasolina" placeholder="Ex: 5.20">

  <label>🌱 Preço do Etanol (R$/L)</label>
  <input type="number" id="precoEtanol" placeholder="Ex: 3.80">

  <label>🚗 Km por viagem</label>
  <input type="number" id="kmViagem" placeholder="Ex: 20">

  <label>📆 Dias que dirige por mês</label>
  <input type="number" id="diasMes" placeholder="Ex: 20">

  <label>🚙 Perfil do carro</label>
  <select id="perfilCarro">
    <option value="1">Leve</option>
    <option value="0.9">Médio</option>
    <option value="0.8">Pesado</option>
  </select>

  <label>⚙️ Modo de condução</label>
  <select id="modoConducao">
    <option value="1.1">Econômico</option>
    <option value="1">Normal</option>
    <option value="0.9">Pesado</option>
  </select>

  <button onclick="calcular()">🔥 Calcular</button>

  <div id="resultado"></div>

  <h3>📜 Histórico</h3>
  <div id="historico"></div>

</main>

<footer>
  <p>RodaMais © 2026 - Comparador inteligente de combustível</p>
</footer>

<script src="script.js"></script>
</body>
</html>
