<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Fretes</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    width: 90%;
    max-width: 400px;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
}

.container img {
    width: 100%;
    border-radius: 15px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 12px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1e3c72;
}

.cadastro {
    margin-top: 15px;
    font-size: 14px;
}

.cadastro a {
    color: #2a5298;
    text-decoration: none;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="container">
    
    <img src="https://images.unsplash.com/photo-1601584115197-04ecc0da31d7" alt="Caminhão">

    <h1 style="color:#2a5298;">Conecta Frete</h1>
    <p style="font-size:14px; color:gray;">
        Conectando empresas e motoristas 🚛
    </p>

    <h2>Login</h2>

    <input type="text" id="login" placeholder="Login">
    <input type="password" id="senha" placeholder="Senha">

    <button onclick="entrar()">Entrar</button>

    <div class="cadastro">
        Você não tem cadastro? <br>
        <a href="cadastro.html">Cadastre-se aqui</a>
    </div>

</div>

<!-- 🔥 FIREBASE + LOGIN -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyC5iPsX34H7evZiDwTm9CUnl0CRA6iLnpQ",
  authDomain: "conecta-frete-53e03.firebaseapp.com",
  projectId: "conecta-frete-53e03",
  storageBucket: "conecta-frete-53e03.appspot.com",
  messagingSenderId: "558425558991",
  appId: "1:558425558991:web:89069fccbd3b3cf3884cba"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 SHA-256 (PADRÃO DO SISTEMA)
async function criptografarSHA256(senha){
    const encoder = new TextEncoder();
    const data = encoder.encode(senha);
    const hash = await crypto.subtle.digest("SHA-256", data);

    return Array.from(new Uint8Array(hash))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}

// 🔐 BASE64 (compatibilidade antiga)
function criptografarBtoa(senha){
    return btoa(senha);
}

// 🔥 LOGIN
window.entrar = async function(){

    let login = document.getElementById("login").value.trim();
    let senhaDigitada = document.getElementById("senha").value.trim();

    if(!login || !senhaDigitada){
        alert("Preencha login e senha!");
        return;
    }

    let senhaSHA = await criptografarSHA256(senhaDigitada);
    let senhaBtoa = criptografarBtoa(senhaDigitada);

    // 🔎 BUSCA POR LOGIN
    const qEmpresa = query(
        collection(db, "empresas"),
        where("login", "==", login)
    );

    const qMotorista = query(
        collection(db, "motoristas"),
        where("login", "==", login)
    );

    const resEmpresa = await getDocs(qEmpresa);
    const resMotorista = await getDocs(qMotorista);

    // 🏢 EMPRESA
    if(!resEmpresa.empty){

        let empresa = resEmpresa.docs[0].data();

        if(
            empresa.senha === senhaSHA || // padrão atual
            empresa.senha === senhaDigitada || // antigo
            empresa.senha === senhaBtoa // intermediário
        ){
            localStorage.setItem("usuarioLogado", JSON.stringify(empresa));
            alert("Login realizado com sucesso! 🏢");
            window.location.href = "painel_empresa.html";
            return;
        }
    }

    // 🚛 MOTORISTA
    if(!resMotorista.empty){

        let motorista = resMotorista.docs[0].data();

        if(
            motorista.senha === senhaSHA ||
            motorista.senha === senhaDigitada ||
            motorista.senha === senhaBtoa
        ){
            localStorage.setItem("usuarioLogado", JSON.stringify(motorista));
            alert("Login realizado com sucesso! 🚛");
            window.location.href = "painel_motorista.html";
            return;
        }
    }

    alert("Login ou senha inválidos!");
}

</script>

</body>
</html>
