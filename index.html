<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Fretes</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    width: 90%;
    max-width: 400px;
    border-radius: 120px;
    padding: 35px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
}

.container img {
    width: 100%;
    border-radius: 15px;
    margin-bottom: 20px;
}

h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 12px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1e3c72;
}

.cadastro {
    margin-top: 15px;
    font-size: 14px;
}

.cadastro a {
    color: #2a5298;
    text-decoration: none;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="container">
    
    <!-- TROQUE ESSA IMAGEM POR UMA SUA DE CAMINHÃO -->
    <img src="https://images.unsplash.com/photo-1601584115197-04ecc0da31d7" alt="Caminhão">

    <h1 style="color:#2a5298; margin-bottom:5px;">Conecta Frete</h1>
    <p style="margin-top:0; font-size:14px; color:gray;">
	Conectando empresas e motoristas 🚛
    </p>

<h2 style="margin-top:20px;">Login</h2>

    <input type="text" id="login" placeholder="Login">
    <input type="password" id="senha" placeholder="Senha">

    <button onclick="entrar()">Entrar</button>

    <div class="cadastro">
        Você já tem cadastro? <br>
        <a href="cadastro.html">Cadastre-se aqui</a>
    </div>

</div>
<script>

function entrar(){

    let login = document.getElementById("login").value;
    let senha = document.getElementById("senha").value;

    let usuarioSalvo = localStorage.getItem(login);

    if(usuarioSalvo === null){
        alert("Usuário não encontrado!");
        return;
    }

    let usuario = JSON.parse(usuarioSalvo);

    if(usuario.senha !== senha){
        alert("Senha incorreta!");
        return;
    }

    // Salva quem está logado
    localStorage.setItem("usuarioLogado", login);

    if(usuario.tipo == "motorista"){
       window.location.href = "fretes_motorista.html";
    }

    if(usuario.tipo == "empresa"){
       window.location.href = "painel_empresa.html";
    }

    // Redireciona dependendo do tipo
    if(usuario.tipo === "motorista"){
        window.location.href = "painel_motorista.html";
    } else if(usuario.tipo === "empresa"){
        window.location.href = "painel_empresa.html";
    }
}
</script>

</body>
</html>
