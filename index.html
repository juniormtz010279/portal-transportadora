<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Fretes</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    width: 90%;
    max-width: 400px;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
}

.container img {
    width: 100%;
    border-radius: 15px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 12px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1e3c72;
}

.cadastro {
    margin-top: 15px;
    font-size: 14px;
}

.cadastro a {
    color: #2a5298;
    text-decoration: none;
    font-weight: bold;
}
</style>

</head>
<body>

<div class="container">
    
    <img src="https://images.unsplash.com/photo-1601584115197-04ecc0da31d7" alt="Caminhão">

    <h1 style="color:#2a5298;">Conecta Frete</h1>
    <p style="font-size:14px; color:gray;">
        Conectando empresas e motoristas 🚛
    </p>

    <h2>Login</h2>

    <input type="text" id="login" placeholder="Login">
    <input type="password" id="senha" placeholder="Senha">

    <button onclick="entrar()">Entrar</button>

    <div class="cadastro">
        Você não tem cadastro? <br>
        <a href="cadastro.html">Cadastre-se aqui</a>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyC5iPsX34H7evZiDwTm9CUnl0CRA6iLnpQ",
  authDomain: "conecta-frete-53e03.firebaseapp.com",
  projectId: "conecta-frete-53e03",
  storageBucket: "conecta-frete-53e03.appspot.com",
  messagingSenderId: "558425558991",
  appId: "1:558425558991:web:89069fccbd3b3cf3884cba"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const messaging = getMessaging(app);

// 🔧 REGISTRAR SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/firebase-messaging-sw.js')
    .then((registration) => {
      console.log('Service Worker registrado:', registration);
    })
    .catch((err) => {
      console.log('Erro no Service Worker:', err);
    });
}

// 🔔 RECEBER NOTIFICAÇÃO COM APP ABERTO
onMessage(messaging, (payload) => {
    console.log("Notificação recebida:", payload);
    alert(payload.notification.title + "\n" + payload.notification.body);
});

// 🔐 SHA-256
async function criptografarSHA256(senha){
    const encoder = new TextEncoder();
    const data = encoder.encode(senha);
    const hash = await crypto.subtle.digest("SHA-256", data);

    return Array.from(new Uint8Array(hash))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}

// 🔐 BASE64
function criptografarBtoa(senha){
    return btoa(senha);
}

// 🔥 LOGIN
window.entrar = async function(){

    let login = document.getElementById("login").value.trim();
    let senhaDigitada = document.getElementById("senha").value.trim();

    if(!login || !senhaDigitada){
        alert("Preencha login e senha!");
        return;
    }

    let senhaSHA = await criptografarSHA256(senhaDigitada);
    let senhaBtoa = criptografarBtoa(senhaDigitada);

    const qEmpresa = query(collection(db, "empresas"), where("login", "==", login));
    const qMotorista = query(collection(db, "motoristas"), where("login", "==", login));

    const resEmpresa = await getDocs(qEmpresa);
    const resMotorista = await getDocs(qMotorista);

    if(!resEmpresa.empty){
        let empresa = resEmpresa.docs[0].data();
        if(empresa.senha === senhaSHA || empresa.senha === senhaDigitada || empresa.senha === senhaBtoa){
            localStorage.setItem("usuarioLogado", JSON.stringify(empresa));
            alert("Login realizado com sucesso! 🏢");
            window.location.href = "painel_empresa.html";
            return;
        }
    }

    if(!resMotorista.empty){
        let motorista = resMotorista.docs[0].data();
        if(motorista.senha === senhaSHA || motorista.senha === senhaDigitada || motorista.senha === senhaBtoa){
            localStorage.setItem("usuarioLogado", JSON.stringify(motorista));
            alert("Login realizado com sucesso! 🚛");
            window.location.href = "painel_motorista.html";
            return;
        }
    }

    alert("Login ou senha inválidos!");
}

// 🔔 ATUALIZA TOKEN
async function atualizarToken() {
    try {
        const token = await getToken(messaging, {
            vapidKey: 'SUA_VAPID_KEY'
        });

        console.log("Token atualizado:", token);

        await db.collection("tokens").doc("juniormtz").set({
            token: token,
            tipo: "motorista",
            updatedAt: new Date()
        });

        console.log("Token salvo no Firestore!");
    } catch (err) {
        console.error("Erro ao pegar token:", err);
    }
}

// 🚀 CHAMA AO ABRIR
atualizarToken();

</script>

</body>
</html>
