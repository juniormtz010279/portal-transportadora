<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Empresa - Conecta Frete</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(to bottom,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:90%;
max-width:380px;
border-radius:20px;
padding:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h1{
text-align:center;
color:#2a5298;
margin-bottom:5px;
}

.subtitulo{
text-align:center;
font-size:14px;
color:gray;
margin-bottom:20px;
}

.info{
margin-bottom:8px;
font-size:14px;
}

.label{
font-weight:bold;
}

button{
width:100%;
padding:10px;
background:#2a5298;
color:white;
border:none;
border-radius:10px;
font-size:14px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#1e3c72;
}
</style>

</head>

<body>

<div class="container">

<h1>Conecta Frete</h1>

<div class="subtitulo">
Painel da Empresa 🏢
</div>

<div id="dadosEmpresa"></div>

<button onclick="window.location.href='cadastro_frete.html'">
Cadastrar Novo Frete
</button>

<button onclick="window.location.href='fretes_empresa.html'">
Visualizar Fretes 📋
</button>

<button onclick="sair()">
Sair
</button>

</div>

<script>

let login = localStorage.getItem("usuarioLogado");

if(!login){
window.location.href = "index.html";
}

let usuario = JSON.parse(localStorage.getItem(login));

if(!usuario || usuario.tipo !== "empresa"){
window.location.href = "index.html";
}

let div = document.getElementById("dadosEmpresa");

div.innerHTML = `
<div class="info"><span class="label">Empresa:</span> ${usuario.nomeEmpresa}</div>
<div class="info"><span class="label">CNPJ:</span> ${usuario.cnpj}</div>
<div class="info"><span class="label">Telefone:</span> ${usuario.telefone}</div>
<div class="info"><span class="label">WhatsApp:</span> ${usuario.whatsapp}</div>
<div class="info"><span class="label">Endereço:</span> ${usuario.endereco}</div>
`;

function sair(){
localStorage.removeItem("usuarioLogado");
window.location.href = "index.html";
}

</script>

</body>
</html>
