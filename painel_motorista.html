<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Motorista - Conecta Frete</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    width: 90%;
    max-width: 380px;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h1 {
    text-align: center;
    color: #2a5298;
}

.subtitulo {
    text-align: center;
    font-size: 14px;
    color: gray;
    margin-bottom: 20px;
}

.info {
    margin-bottom: 10px;
    font-size: 14px;
}

.label {
    font-weight: bold;
}

button {
    width: 100%;
    padding: 10px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1e3c72;
}
</style>

</head>
<body>

<div class="container">

<h1>Conecta Frete</h1>

<div class="subtitulo">
Painel do Motorista 🚛
</div>

<div id="dadosMotorista"></div>

<button onclick="verFretes()">Ver Fretes Disponíveis 🚛</button>
<button onclick="sair()">Sair</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { 
  getMessaging,
  getToken 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5iPsX34H7evZiDwTm9CUnl0CRA6iLnpQ",
  authDomain: "conecta-frete-53e03.firebaseapp.com",
  projectId: "conecta-frete-53e03",
  storageBucket: "conecta-frete-53e03.appspot.com",
  messagingSenderId: "558425558991",
  appId: "1:558425558991:web:89069fccbd3b3cf3884cba"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const messaging = getMessaging(app);

// 🔒 VERIFICA LOGIN
let usuario = localStorage.getItem("usuarioLogado");

if(!usuario){
    alert("Você precisa fazer login!");
    window.location.href = "index.html";
}

usuario = JSON.parse(usuario);

// 🔒 GARANTE QUE É MOTORISTA
if(usuario.tipo !== "motorista"){
    alert("Acesso permitido apenas para motoristas!");
    window.location.href = "index.html";
}

// 📄 MOSTRAR DADOS
let div = document.getElementById("dadosMotorista");

div.innerHTML = `
<div class="info"><span class="label">Nome:</span> ${usuario.nome}</div>
<div class="info"><span class="label">Telefone:</span> ${usuario.telefone}</div>
<div class="info"><span class="label">Cidade:</span> ${usuario.cidade}</div>
<div class="info"><span class="label">Região:</span> ${usuario.regiao}</div>
<div class="info"><span class="label">Caminhão:</span> ${usuario.caminhao}</div>
<div class="info"><span class="label">Capacidade:</span> ${usuario.capacidade} toneladas</div>
`;

// 🚪 SAIR
window.sair = function(){
    localStorage.removeItem("usuarioLogado");
    window.location.href = "index.html";
}

// 🚛 VER FRETES
window.verFretes = function(){
    window.location.href = "fretes_motorista.html";
}

// 🔔 ATIVAR NOTIFICAÇÃO (VERSÃO SEGURA)
async function ativarNotificacao(){

    try{

        const permission = await Notification.requestPermission();

        if(permission !== "granted"){
            console.log("Permissão negada para notificações");
            return;
        }

        const token = await getToken(messaging, {
            vapidKey: "BAPMI5V2_d3RXC4spI0DiRKVJv0fwh0_NcxDs2pkagSBI3x7yy-ej2oxxg42bG9gSXP4vxy5o9hiXm7ZyaqiKeQ"
        });

        if(!token){
            console.log("Token não gerado");
            return;
        }

        console.log("TOKEN:", token);

        await setDoc(doc(db, "tokens", usuario.login), {
            token: token,
            tipo: "motorista"
        });

        console.log("Token salvo no banco");

    }catch(e){
        console.error("Erro na notificação:", e);
    }
}

// CHAMAR AUTOMATICAMENTE
ativarNotificacao();

</script>

</body>
</html>
