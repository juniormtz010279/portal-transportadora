<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Motorista - Conecta Frete</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    width: 90%;
    max-width: 380px;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: left;
}

h1 {
    text-align: center;
    color: #2a5298;
    margin-bottom: 5px;
}

.subtitulo {
    text-align: center;
    font-size: 14px;
    color: gray;
    margin-bottom: 20px;
}

.info {
    margin-bottom: 10px;
    font-size: 14px;
}

.label {
    font-weight: bold;
}

button {
    width: 100%;
    padding: 10px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    background: #1e3c72;
}
</style>

</head>
<body>

<div class="container">

    <h1>Conecta Frete</h1>
    <div class="subtitulo">
        Painel do Motorista 🚛
    </div>

    <div id="dadosMotorista"></div>

    <button onclick="verFretes()">Ver Fretes Disponíveis 🚛</button>
    <button onclick="sair()">Sair</button>
</div>

<script>

// Verifica se existe usuário logado
let login = localStorage.getItem("usuarioLogado");

if(!login){
    window.location.href = "index.html";
}

// Busca dados do usuário
let usuario = JSON.parse(localStorage.getItem(login));

if(!usuario){
    window.location.href = "index.html";
}

// Verifica se é motorista
if(usuario.tipo !== "motorista"){
    window.location.href = "index.html";
}

// Mostra dados
let div = document.getElementById("dadosMotorista");

div.innerHTML = `
    <div class="info"><span class="label">Nome:</span> ${usuario.nome}</div>
    <div class="info"><span class="label">Telefone:</span> ${usuario.telefone}</div>
    <div class="info"><span class="label">Cidade:</span> ${usuario.cidade}</div>
    <div class="info"><span class="label">Região:</span> ${usuario.regiao}</div>
    <div class="info"><span class="label">Caminhão:</span> ${usuario.caminhao}</div>
    <div class="info"><span class="label">Capacidade:</span> ${usuario.capacidade} toneladas</div>
`;

function sair(){
    localStorage.removeItem("usuarioLogado");
    window.location.href = "index.html";
}

function verFretes(){
    window.location.href = "fretes_motorista.html";
}

</script>

</body>
</html>
